<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — GovPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0B2265',
                        gold: '#FFCE00',
                        electric: '#0066CC',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .eyebrow-line { width: 32px; height: 2px; background-color: #FFCE00; display: inline-block; }
        .hero-bg {
            background-color: #0B2265;
            background-image: radial-gradient(circle at 100% 0%, rgba(255, 206, 0, 0.12) 0%, transparent 50%),
                              radial-gradient(circle at 0% 100%, rgba(0, 102, 204, 0.25) 0%, transparent 50%);
        }
    </style>
</head>
<body class="hero-bg min-h-screen flex flex-col">

    <!-- TOP HEADER: BRAND ONLY -->
    <header class="w-full px-6 pt-10 pb-6 flex items-center justify-center">
        <a href="index.html" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
            MICT | GovPulse
        </a>
    </header>

    <!-- MAIN: LOGIN FORM -->
    <main class="flex-1 flex items-center justify-center px-6 pb-16">
        <div class="w-full max-w-md">

            <!-- Eyebrow + Title -->
            <div class="text-center mb-8">
                <div class="flex items-center justify-center gap-3 mb-5">
                    <span class="eyebrow-line"></span>
                    <span class="text-gold text-xs font-bold tracking-widest uppercase">GOVERNMENT MEDIA MONITORING SYSTEM</span>
                    <span class="eyebrow-line"></span>
                </div>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-white mb-3 tracking-tight">
                    Welcome back
                </h1>
                <p class="text-slate-300 text-sm sm:text-base">
                    Sign in to access the Government Media Monitoring System.
                </p>
            </div>

            <!-- Login Card -->
            <div class="bg-white rounded-xl shadow-2xl border border-white/10 p-8 sm:p-10">

                <div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-md px-4 py-3 mb-6">
                </div>

                <form id="login-form">
                    <div class="mb-5">
                        <label for="username" class="block text-sm font-semibold text-slate-700 mb-2">
                            Username
                        </label>
                        <input type="text" id="username" name="username" required
                               class="w-full px-4 py-3 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-electric focus:border-transparent transition bg-slate-50 focus:bg-white"
                               placeholder="Enter your username">
                    </div>

                    <div class="mb-6">
                        <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">
                            Password
                        </label>
                        <input type="password" id="password" name="password" required
                               class="w-full px-4 py-3 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-electric focus:border-transparent transition bg-slate-50 focus:bg-white"
                               placeholder="Enter your password">
                    </div>

                    <button type="submit" id="login-btn"
                            class="w-full bg-electric text-white font-bold py-3.5 rounded-md hover:bg-blue-700 transition shadow-md flex items-center justify-center gap-2">
                        <span id="btn-text">Sign In</span>
                        <span id="btn-spinner" class="hidden">
                            <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                            </svg>
                        </span>
                    </button>
                </form>

            </div>

            <!-- Footer note -->
            <div class="mt-8 text-center text-xs text-slate-400">
                © 2026 GovPulse · Ministry of Information and Communication Technology | All rights reserved.
            </div>

        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        if (isLoggedIn()) {
            window.location.href = "dashboard.html";
        }

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            const errorBox = document.getElementById("error-box");
            const btnText = document.getElementById("btn-text");
            const btnSpinner = document.getElementById("btn-spinner");
            const btn = document.getElementById("login-btn");

            errorBox.classList.add("hidden");
            btnText.textContent = "Signing in...";
            btnSpinner.classList.remove("hidden");
            btn.disabled = true;

            try {
                const data = await login(username, password);
                if (data.role === "ministry") {
                    window.location.href = "ministry.html";
                } else {
                    window.location.href = "dashboard.html";
                }
            } catch (err) {
                errorBox.textContent = err.message || "Login failed";
                errorBox.classList.remove("hidden");
                btnText.textContent = "Sign In";
                btnSpinner.classList.add("hidden");
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
